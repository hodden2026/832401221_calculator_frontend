<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="基于前后端分离架构实现的计算器系统"
    >

    <title>前后端分离计算器</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <header class="top-bar">

        <div>
            <h1>前后端分离计算器</h1>

            <p>
                Front-End / Back-End Separation Calculator
            </p>
        </div>


        <button
            id="theme-toggle-button"
            class="theme-toggle-button"
            type="button"
            title="切换主题"
        >
            🌙 深色模式
        </button>

    </header>


    <main class="page-container">

        <!-- =========================
             计算器
             ========================= -->

        <section class="calculator-card">

            <div class="section-title">

                <div>
                    <h2>计算器</h2>

                    <p>
                        最终计算由后端完成
                    </p>
                </div>

                <span
                    id="backend-status"
                    class="status-badge"
                >
                    后端状态未知
                </span>

            </div>


            <div class="display">

                <div class="display-label">
                    表达式
                </div>

                <div
                    id="expression-display"
                    class="expression-display"
                >
                    0
                </div>


                <div class="display-label result-label">
                    结果
                </div>

                <div
                    id="result-display"
                    class="result-display"
                >
                    0
                </div>

            </div>


            <div
                id="error-message"
                class="error-message"
                role="alert"
            ></div>


            <div class="calculator-buttons">

                <button
                    type="button"
                    class="control-button"
                    data-action="clear"
                >
                    AC
                </button>


                <button
                    type="button"
                    class="control-button"
                    data-action="backspace"
                >
                    ⌫
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value="("
                >
                    (
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value=")"
                >
                    )
                </button>


                <button
                    type="button"
                    data-value="7"
                >
                    7
                </button>


                <button
                    type="button"
                    data-value="8"
                >
                    8
                </button>


                <button
                    type="button"
                    data-value="9"
                >
                    9
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value="/"
                >
                    ÷
                </button>


                <button
                    type="button"
                    data-value="4"
                >
                    4
                </button>


                <button
                    type="button"
                    data-value="5"
                >
                    5
                </button>


                <button
                    type="button"
                    data-value="6"
                >
                    6
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value="*"
                >
                    ×
                </button>


                <button
                    type="button"
                    data-value="1"
                >
                    1
                </button>


                <button
                    type="button"
                    data-value="2"
                >
                    2
                </button>


                <button
                    type="button"
                    data-value="3"
                >
                    3
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value="-"
                >
                    −
                </button>


                <button
                    type="button"
                    data-value="0"
                >
                    0
                </button>


                <button
                    type="button"
                    data-value="."
                >
                    .
                </button>


                <button
                    type="button"
                    class="equals-button"
                    data-action="calculate"
                >
                    =
                </button>


                <button
                    type="button"
                    class="operator-button"
                    data-value="+"
                >
                    +
                </button>

            </div>


            <div class="keyboard-help">

                <strong>键盘快捷键</strong>

                <span>
                    数字与 + - * / ( ) . 直接输入
                </span>

                <span>
                    Enter：计算
                </span>

                <span>
                    Backspace：退格
                </span>

                <span>
                    Esc：清空
                </span>

            </div>

        </section>


        <!-- =========================
             历史记录
             ========================= -->

        <section class="history-card">

            <div class="history-header">

                <div>
                    <h2>计算历史</h2>

                    <p id="history-count">
                        共 0 条记录
                    </p>
                </div>


                <div class="history-actions">

                    <button
                        id="refresh-history-button"
                        class="secondary-button"
                        type="button"
                    >
                        刷新
                    </button>


                    <button
                        id="clear-history-button"
                        class="danger-outline-button"
                        type="button"
                    >
                        清空全部
                    </button>

                </div>

            </div>


            <div class="history-search">

                <input
                    id="history-search-input"
                    type="text"
                    placeholder="搜索表达式、结果或时间..."
                    autocomplete="off"
                >

            </div>


            <div
                id="history-list"
                class="history-list"
            >

                <p class="empty-message">
                    正在读取计算历史...
                </p>

            </div>

        </section>

    </main>


    <footer class="page-footer">

        <p>
            Calculator System · Front-End / Back-End Separation
        </p>

        <p>
            核心计算与历史记录均由后端处理
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
